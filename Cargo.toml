[package]
name = "qq-banner"
version = "3.9.5"
edition = "2024"
default-run = "qq-banner"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"
serde_json = "1.0.149"
thiserror = "2.0.18"
toasty = { version = "0.7.0", features = ["sqlite", "serde"] }
toasty-cli = "0.7.0"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = [
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "cors",
    "fs",
] }
uuid = { version = "1.23.1", features = ["v4"] }
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "rustls-tls",
] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
chrono = "0.4.44"
include_dir = "0.7.4"
sled = "0.34.7"
http = "1.4.0"
futures-util = "0.3.32"
tokio-stream = { version = "0.1.18", features = ["time"] }
memory-serve = "2.1.0"
cached = { version = "1.1.0", features = ["async_tokio_rt_multi_thread"] }
tokio-cron-scheduler = "0.15.1"
chrono-tz = "0.10.4"


[build-dependencies]
memory-serve = "2.1.0"
